<!DOCTYPE html>
<html lang="en" data-theme="dark">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Gourav R — Backend developer (Django · Python · SQL)</title>
<meta name="description" content="Gourav R builds Django APIs, data models and the backend plumbing behind web apps. Projects, engineering journey and contact details." />
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,300..800&family=Instrument+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="portfolio.css" />
</head>
<body>
<div id="root"></div>
<div id="boot" style="position:fixed;inset:0;display:grid;place-content:center;font-family:var(--mono);font-size:13px;color:var(--muted);background:var(--bg);z-index:130">
  <span id="boot-msg">Loading portfolio…</span>
</div>

<script>
(function () {
  var sets = {
    react: [
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.3.1/umd/react.production.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/react/18.2.0/umd/react.production.min.js",
      "https://cdn.jsdelivr.net/npm/react@18.3.1/umd/react.production.min.js"
    ],
    dom: [
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.3.1/umd/react-dom.production.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/react-dom/18.2.0/umd/react-dom.production.min.js",
      "https://cdn.jsdelivr.net/npm/react-dom@18.3.1/umd/react-dom.production.min.js"
    ],
    babel: [
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.26.4/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.25.6/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.24.7/babel.min.js",
      "https://cdnjs.cloudflare.com/ajax/libs/babel-standalone/7.23.2/babel.min.js",
      "https://cdn.jsdelivr.net/npm/@babel/standalone@7/babel.min.js"
    ]
  };
  function load(urls, i, ok, fail) {
    if (i >= urls.length) return fail();
    var s = document.createElement("script");
    s.src = urls[i];
    s.onload = ok;
    s.onerror = function () { load(urls, i + 1, ok, fail); };
    document.head.appendChild(s);
  }
  function fail() {
    var m = document.getElementById("boot-msg");
    if (m) m.innerHTML = "The page runtime could not load — check your connection and reload.<br><br>Reach Gourav directly: <a style='color:#3FD9A4' href='mailto:gkprof1107@gmail.com'>gkprof1107@gmail.com</a>";
  }
  function run() {
    fetch("portfolio.js")
      .then(function (r) {
        if (!r.ok) throw new Error("script.js not found");
        return r.text();
      })
      .then(function (src) {
        var out = Babel.transform(src, { presets: ["react"] }).code;
        var s = document.createElement("script");
        s.textContent = out;
        document.body.appendChild(s);
      })
      .catch(fail);
  }
  load(sets.react, 0, function () { load(sets.dom, 0, function () { load(sets.babel, 0, run, fail); }, fail); }, fail);
})();
</script>
</body>
</html>
