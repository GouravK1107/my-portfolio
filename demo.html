<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Bingi Nagateja | Data Analyst Portfolio</title>
<meta name="description" content="Portfolio of Bingi Nagateja, aspiring Data Analyst skilled in Python, SQL, Power BI and Excel.">
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 10 10%22><rect width=%2210%22 height=%224%22 fill=%22%235fb548%22/><rect y=%224%22 width=%2210%22 height=%226%22 fill=%22%238a5a35%22/></svg>">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@500;700&family=Sora:wght@300;400;600&display=swap" rel="stylesheet">
<style>
:root{--night:#0d1220;--deep:#151c30;--panel:#1b2440;--grass:#5fb548;--dirt:#8a5a35;--stone:#7d8590;--diamond:#4fe3e0;--gold:#f2c94c;--ink:#e9eefb;--mute:#9aa6c3;--px:'Pixelify Sans','Courier New',monospace;--body:'Sora',system-ui,sans-serif}
*{box-sizing:border-box;margin:0}html{scroll-behavior:smooth}
body{background:radial-gradient(1200px 700px at 75% -10%,#26386b55,transparent),var(--night);color:var(--ink);font:300 1rem/1.7 var(--body);overflow-x:hidden}
canvas#fx{position:fixed;inset:0;z-index:0;pointer-events:none}
#xp{position:fixed;top:0;left:0;height:6px;width:100%;z-index:50;background:#0008}
#xp i{display:block;height:100%;width:0;background:linear-gradient(#9dff6a,#3f8f2c);box-shadow:0 0 12px #7dff4f}
main,footer{position:relative;z-index:1}
section{max-width:1080px;margin:0 auto;padding:110px 24px 30px}
h2{font:700 clamp(1.9rem,4vw,2.8rem)/1.1 var(--px);margin-bottom:8px;text-shadow:3px 3px 0 #000a}
.sub{color:var(--mute);max-width:56ch;margin-bottom:38px}
.px{border:4px solid #000;box-shadow:inset 4px 4px 0 #ffffff26,inset -4px -4px 0 #0006,0 14px 30px #0006;background:var(--panel)}
.rv{opacity:0;transform:translateY(34px) scale(.98);transition:opacity .8s cubic-bezier(.2,.7,.2,1),transform .8s cubic-bezier(.2,.7,.2,1)}
.rv.on{opacity:1;transform:none}
/* hero */
.hero{min-height:100vh;display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;max-width:1080px;margin:0 auto;padding:90px 24px 40px}
.hero h1{font:700 clamp(2.6rem,7vw,5rem)/1 var(--px);text-shadow:4px 4px 0 #000,0 0 30px #5fb54855}
.hero h1 span{display:block;opacity:0;transform:translateY(40px) rotateX(-60deg);transform-origin:top;animation:drop .9s cubic-bezier(.2,.8,.2,1) forwards}
.hero h1 span:nth-child(2){animation-delay:.18s}
@keyframes drop{to{opacity:1;transform:none}}
.role{font:500 1.3rem var(--px);color:var(--gold);margin:18px 0 12px;min-height:1.8em}
.role b{display:inline-block;width:10px;height:1.1em;background:var(--gold);vertical-align:-3px;animation:bl 1s steps(1) infinite}
@keyframes bl{50%{opacity:0}}
.lead{color:var(--mute);max-width:46ch;margin-bottom:28px}
.btns{display:flex;gap:14px;flex-wrap:wrap}
.btn{font:500 1rem var(--px);color:#fff;text-decoration:none;padding:12px 22px;border:4px solid #000;background:#6b7280;box-shadow:inset 3px 3px 0 #fff5,inset -3px -3px 0 #0006;transition:transform .15s,filter .2s;display:inline-block}
.btn.g{background:#3f8f2c}.btn:hover{transform:translateY(-4px);filter:brightness(1.2)}.btn:active{transform:translateY(1px)}
.scene{position:relative;height:460px;perspective:1000px;display:grid;place-items:center}
.frame{width:280px;transform-style:preserve-3d;transition:transform .2s ease-out;padding:14px;background:linear-gradient(135deg,#a8743f,#6b4423);border:4px solid #000;box-shadow:inset 4px 4px 0 #ffffff33,inset -4px -4px 0 #0005,0 40px 60px #000a;animation:bob 6s ease-in-out infinite}
.frame img{display:block;width:100%;aspect-ratio:1;object-fit:cover;border:4px solid #000;image-rendering:auto}
.frame small{display:block;text-align:center;font:500 .95rem var(--px);margin-top:8px;color:#fff;text-shadow:2px 2px 0 #000}
@keyframes bob{50%{translate:0 -14px}}
.cw{position:absolute;width:var(--s);height:var(--s);transform-style:preserve-3d;animation:spin var(--d) linear infinite}
.cw>div{position:absolute;inset:0;border:2px solid #0008;image-rendering:pixelated}
@keyframes spin{from{transform:rotateX(-25deg) rotateY(0)}to{transform:rotateX(-25deg) rotateY(360deg)}}
.fl{position:absolute;animation:bob 5s ease-in-out infinite}
.f{transform:translateZ(calc(var(--s)/2))}.b{transform:rotateY(180deg) translateZ(calc(var(--s)/2))}.r{transform:rotateY(90deg) translateZ(calc(var(--s)/2))}.l{transform:rotateY(-90deg) translateZ(calc(var(--s)/2))}.t{transform:rotateX(90deg) translateZ(calc(var(--s)/2))}.bt{transform:rotateX(-90deg) translateZ(calc(var(--s)/2))}
.chk{--c:#0003;background-image:conic-gradient(var(--c) 25%,transparent 0 50%,var(--c) 0 75%,transparent 0);background-size:20% 20%}
.grass-s{background-color:#8a5a35;background-image:linear-gradient(#5fb548 28%,transparent 28%),conic-gradient(#0003 25%,transparent 0 50%,#0003 0 75%,transparent 0);background-size:100% 100%,20% 20%}
.grass-t{background-color:#5fb548}.dirt{background-color:#8a5a35}.dia{background-color:#7d8590;background-image:radial-gradient(circle,var(--diamond) 22%,transparent 24%),conic-gradient(#0003 25%,transparent 0 50%,#0003 0 75%,transparent 0);background-size:50% 50%,20% 20%}
.gold{background-color:var(--gold);background-image:linear-gradient(135deg,#fff8 0 20%,transparent 20%),conic-gradient(#0002 25%,transparent 0 50%,#0002 0 75%,transparent 0);background-size:100% 100%,25% 25%}
/* skills */
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:24px}
.gui{padding:20px 20px 24px;background:#c6c6c6;border:4px solid #000;box-shadow:inset 4px 4px 0 #fff,inset -4px -4px 0 #7a7a7a,0 16px 30px #0007;color:#404040}
.gui h3{font:700 1.1rem var(--px);color:#404040;margin-bottom:16px}
.slots{display:grid;grid-template-columns:repeat(auto-fill,minmax(74px,1fr));gap:14px 8px}
.slot{position:relative;text-align:center;font:500 .72rem/1.15 var(--px);color:#404040}
.cell{height:64px;display:grid;place-items:center;background:#8b8b8b;border:3px solid;border-color:#373737 #fff #fff #373737;transition:background .2s}
.slot:hover .cell{background:#a9aacf}
.ore{width:38px;height:38px;background-color:#7d8590;background-image:radial-gradient(circle at 26% 30%,var(--c) 0 13%,transparent 14%),radial-gradient(circle at 72% 26%,var(--c) 0 11%,transparent 12%),radial-gradient(circle at 48% 72%,var(--c) 0 14%,transparent 15%),radial-gradient(circle at 82% 74%,var(--c) 0 9%,transparent 10%),conic-gradient(#0003 25%,transparent 0 50%,#0003 0 75%,transparent 0);background-size:100% 100%,100% 100%,100% 100%,100% 100%,25% 25%;border:2px solid #0006;box-shadow:inset 3px 3px 0 #fff3,inset -3px -3px 0 #0005;transition:transform .25s cubic-bezier(.3,1.6,.5,1)}
.slot:hover .ore{transform:translateY(-4px) rotate(-6deg) scale(1.12)}
.slot span{display:block;margin-top:6px;word-break:break-word}
.slot:hover:after{content:attr(data-t);position:absolute;bottom:calc(100% - 2px);left:50%;translate:-50% 0;background:#100010f0;border:2px solid #5b2a9e;color:#fff;padding:3px 9px;font:500 .78rem var(--px);white-space:nowrap;z-index:5;pointer-events:none}
.slot.mined .ore{animation:mine .55s}
@keyframes mine{20%{transform:translateX(-4px) scale(.9)}40%{transform:translateX(4px) scale(.85)}60%{transform:scale(.6);filter:brightness(1.8)}}
.chip{position:absolute;left:calc(50% - 3px);top:30px;width:7px;height:7px;background:var(--c);opacity:0;pointer-events:none;z-index:4}
.mined .chip{animation:chip .6s ease-out both}
@keyframes chip{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
/* projects */
.forest{background:#1f291fe8;border-block:4px solid #000}
.chests{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:30px;padding-top:70px}
.ci{padding:8px;transition:outline-color .2s;outline:3px solid transparent;outline-offset:6px}.ci.sel{outline-color:var(--gold)}
.chest{position:relative;height:170px}.chest:hover:not(.open){animation:wig .35s}
@keyframes wig{25%{rotate:-1.5deg}75%{rotate:1.5deg}}
.cbody{position:absolute;left:0;right:0;top:28%;bottom:0;background:#8b5a20;border:4px solid #000;box-shadow:inset 4px 4px 0 #ffffff22,inset -4px -4px 0 #0004;overflow:hidden}
.inn{position:absolute;inset:0;background:#121212;display:grid;align-content:end;justify-items:center;text-align:center;font:500 .8rem/1.3 var(--px);color:#dff;padding:10px;opacity:0;transition:opacity .3s .2s}
.open .inn{opacity:1}
.lid{position:absolute;left:0;right:0;top:0;height:31%;background:linear-gradient(#a56f33 68%,#7a4f1e 68%);border:4px solid #000;box-shadow:inset 4px 4px 0 #ffffff26;transform-origin:0 100%;transition:transform .7s cubic-bezier(.3,1.5,.5,1);z-index:3}
.open .lid{transform:translate(-8%,-115%) rotate(-38deg)}
.latch{position:absolute;left:calc(50% - 13px);top:19%;width:26px;height:32px;background:#cfcfcf;border:4px solid #000;z-index:4;transition:transform .4s,opacity .3s}
.open .latch{opacity:0;transform:translateY(-30px)}
.pf{position:absolute;left:50%;top:30%;width:0;height:0;opacity:0;z-index:5;pointer-events:none}
.open .pf{opacity:1;animation:rise 1s cubic-bezier(.2,1.4,.4,1) .25s both}
@keyframes rise{from{transform:translateY(20px) scale(.1)}60%{transform:translateY(-110px) scale(1.25)}to{transform:translateY(-80px) scale(1)}}
.orb{position:absolute;left:50%;top:32%;width:8px;height:8px;background:#9dff6a;box-shadow:0 0 8px #7dff4f;opacity:0;z-index:5}
.open .orb{animation:orb .9s ease-out .2s both}
@keyframes orb{from{opacity:1;transform:translate(0,0)}to{opacity:0;transform:translate(var(--dx),var(--dy))}}
.lbl{text-align:center;margin-top:14px;text-shadow:2px 2px 0 #000}.lbl b{display:block;font:500 1.05rem var(--px)}.lbl span{font:500 .85rem var(--px);color:#cfe}
.ov{position:fixed;inset:0;z-index:60;background:#000b;display:grid;place-items:center;padding:16px;animation:fi .25s both;backdrop-filter:blur(3px)}
@keyframes fi{from{opacity:0}}
.tip{width:min(640px,100%);max-height:88vh;overflow:auto;padding:26px;background:#100010f2;border:4px solid #000;box-shadow:0 0 0 4px #2a0a5a,inset 0 0 0 3px #5b2a9e,0 30px 80px #000;animation:pop .6s cubic-bezier(.2,1.4,.4,1) both;transform-origin:50% 100%}
@keyframes pop{from{opacity:0;transform:translateY(140px) scale(.2) rotate(-8deg)}}
.tp{display:flex;gap:18px;align-items:center;margin-bottom:10px}
.slotbig{flex:none;width:88px;height:88px;position:relative;perspective:400px;background:#8b8b8b;border:4px solid #373737;box-shadow:inset 4px 4px 0 #373737,inset -4px -4px 0 #fff}
.tip h3{font:700 1.35rem/1.2 var(--px);color:#fff}.tip .tags{color:#55ffff;font-size:.8rem;margin-top:4px}
.tip p{margin:12px 0 0;font-size:.92rem;color:#e6e6e6}.tip p b{display:block;font:500 1rem var(--px)}.l1{color:#ff5555}.l2{color:#55ffff}.l3{color:#55ff55}
.tip .btns{margin-top:22px}
/* cursors */
html{cursor:var(--k-pick) 12 2,auto}html.c-sword{cursor:var(--k-sword) 27 2,auto}html.c-shovel{cursor:var(--k-shovel) 26 1,auto}
a,.btn,.chest,nav a{cursor:var(--k-hand) 14 2,pointer}.slot{cursor:var(--k-shovel) 26 1,auto}.card{cursor:var(--k-sword) 27 2,auto}.frame{cursor:var(--k-hand) 14 2,pointer}
/* strata */
.strata{display:flex;flex-direction:column;border:4px solid #000;box-shadow:0 20px 40px #0008}
.layer{padding:30px 32px;display:flex;justify-content:space-between;gap:20px;flex-wrap:wrap;background-image:conic-gradient(#0003 25%,transparent 0 50%,#0003 0 75%,transparent 0);background-size:32px 32px;transform-origin:top;transition:transform .8s cubic-bezier(.2,.8,.2,1),opacity .8s}
.rv .layer{transform:scaleY(.2);opacity:0}.rv.on .layer{transform:none;opacity:1}.rv.on .layer:nth-child(2){transition-delay:.15s}.rv.on .layer:nth-child(3){transition-delay:.3s}
.layer h3{font:700 1.3rem var(--px);text-shadow:2px 2px 0 #000}.layer p{color:#ffffffcc;font-size:.9rem}.layer .gp{font:700 1.8rem var(--px);text-shadow:2px 2px 0 #000}
/* advancements */
.dirt-band{background:#7a5232f2;background-image:radial-gradient(#0003 1.5px,transparent 2px),radial-gradient(#f2c94c33 1px,transparent 1.5px);background-size:22px 22px;background-position:0 0,11px 11px;margin-top:60px;border-block:4px solid #000}
.dirt-band section{padding-bottom:100px}.dirt-band .sub{color:#ecdcc2}
.tl{position:relative;padding-left:52px}.tl:before{content:"";position:absolute;left:14px;top:0;bottom:0;width:6px;background:#4a2e17}
.tli{position:relative;margin-bottom:22px}.tli.rv{transform:translateX(-40px)}.tli.rv.on{transform:none}
.star{position:absolute;left:-52px;top:20px;width:38px;height:38px;display:grid;place-items:center;background:#f2c94c;border:4px solid #000;color:#000;font-size:1.1rem}
.rv.on .star{animation:sp .6s .25s both cubic-bezier(.2,1.6,.4,1)}@keyframes sp{from{transform:scale(0) rotate(-90deg)}}
.card{background:#c6c6c6;border:4px solid #262626;box-shadow:inset 3px 3px 0 #fff,inset -3px -3px 0 #7a7a7a,0 8px 0 #0004;padding:18px 24px;color:#111;transition:transform .25s}.card:hover{transform:translateX(8px)}
.card h3{font:700 1rem var(--px);color:#111}.card .meta{color:#555;font:500 .85rem var(--px);margin:4px 0 6px}.card p{color:#111;font-size:.9rem;max-width:70ch}
/* contact */
.ct{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:16px}
.ct a{padding:18px;color:var(--ink);text-decoration:none;transition:transform .2s}.ct a:hover{transform:translateY(-6px)}
.ct b{display:block;font:500 1rem var(--px);color:var(--grass)}.ct span{font-size:.85rem;word-break:break-all}
footer{text-align:center;color:var(--mute);font-size:.8rem;padding:60px 20px 130px}
/* hotbar */
nav{position:fixed;bottom:14px;left:50%;translate:-50% 0;z-index:40;display:flex;gap:4px;padding:5px;background:#000a;border:3px solid #000;backdrop-filter:blur(6px);max-width:96vw}
nav a{position:relative;width:54px;height:54px;display:grid;place-items:center;background:#8b8b8b55;border:3px solid #3a3a3a;color:#fff;text-decoration:none;font-size:1.3rem;transition:transform .2s,border-color .2s}
nav a.on{border-color:#fff;transform:translateY(-8px);background:#8b8b8b99}nav a:hover{transform:translateY(-8px)}
nav a span{position:absolute;bottom:64px;background:#100010ee;border:2px solid #2a0a5a;padding:2px 8px;font:500 .8rem var(--px);opacity:0;pointer-events:none;transition:opacity .2s;white-space:nowrap}nav a:hover span{opacity:1}
a:focus-visible,.btn:focus-visible{outline:3px solid var(--diamond);outline-offset:3px}
@media(max-width:820px){.hero{grid-template-columns:1fr;padding-top:70px}.scene{height:400px}nav a{width:44px;height:44px;font-size:1.1rem}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}.rv,.hero h1 span,.rv .layer{opacity:1;transform:none}}
</style></head><body><div id="root"></div>
